# ===========================================
# License Server 配置文件
# ===========================================

# 服务器端口
server.port=8088

# ===========================================
# MySQL 数据库配置
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/license_server?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ===========================================
# JPA 配置
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# Thymeleaf 配置
# ===========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===========================================
# 应用自定义配置
# ===========================================

# 管理员账号配置
license.admin.username=admin
license.admin.password=admin123

# AES-256-GCM 加密密钥（32字节，Base64编码）
# 首次启动时自动生成，或手动配置固定密钥
license.encryption.key=

# HMAC-SHA256 签名密钥（用于激活码签名）
license.signing.key=

# 激活码默认有效期（天）
license.default.expiry-days=365

# 试用版有效期（天）
license.trial.days=7

# 最大试用次数（同一机器）
license.trial.max-count=1

# 请求时间戳容忍范围（毫秒，防重放攻击）
license.timestamp.tolerance=300000

# ===========================================
# 日志配置
# ===========================================
logging.level.com.license.server=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
